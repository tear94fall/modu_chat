server:
  port: 9999

spring:
  application:
    name: storage-service

  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면
  # Spring Cloud Commons 의 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: /data

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  kafka:
    # 내장 Kafka(@EmbeddedKafka bootstrapServersProperty)가 채우는 주소를 쓴다. 테스트 밖에서 띄우면 localhost:9092.
    bootstrap-servers: localhost:9092
    producer:
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      group-id: test-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  # 이 테스트는 @PostConstruct 에서 실제 S3 호환 스토리지에 접속하므로(로컬: dev 스택의 9000 포트,
  # CI: adobe/s3mock) 로컬 dev 스택의 값과 일치해야 한다. 운영 자격증명이 아니라 개발용 고정값이다.
  accessKey: minio
  secretKey: miniopass
  bucket: file-storage

logging:
  level:
    org:
      apache:
        kafka: DEBUG

# InternalApiFilter / InternalApiFeignConfig 가 요구한다. 운영은 config-repo 가 내려준다.
modu:
  # Kafka 토픽 이름 — 운영은 config-repo messenger.yml 이 내려준다(테스트는 config 서버가 없어 같은 값을 여기에).
  kafka:
    topics:
      chat-message-save: chat.message-save.v1
      chat-message-broadcast: chat.message-broadcast.v1
      chat-message-read: chat.message-read.v1
      chat-message-reaction: chat.message-reaction.v1
      chat-room-created: chat.room-created.v1
      member-update-rollback: member.update-rollback.v1
      storage-upload-rollback: storage.upload-rollback.v1
      chat-cdc: modu.modu-chat.chat
  internal-api:
    token: test-internal-token

# main 의 application.yml 과 같은 probe 설정(이 파일이 main 을 가리므로 여기에도 둔다). HealthProbesTest 가 본다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, s3
        liveness:
          include: livenessState
