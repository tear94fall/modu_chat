# profile-application 모듈 테스트 설정(웹·Spring Cloud 설정 서버 없이 JPA 만).
spring:
  application:
    name: profile-service

  profiles:
    active: test

  # master 와 replica 가 같은 H2 를 본다(복제 지연 없음).
  # 컬럼 이름 value 가 H2 예약어라 테이블이 안 만들어진다(MySQL 은 허용). 예약어에서 뺀다.
  datasource:
    master:
      url: jdbc:h2:mem:profile_application;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-master-pool
        maximum-pool-size: 5

    replica:
      url: jdbc:h2:mem:profile_application;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-replica-pool
        maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    open-in-view: false
