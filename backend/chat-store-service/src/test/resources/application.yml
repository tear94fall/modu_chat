server:
  port: 8100

spring:
  application:
    name: chat-store-service

  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면
  # Spring Cloud Commons 의 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false

  kafka:
    consumer:
      bootstrap-servers: localhost:29092
      group-id: chat-store
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      # 컨텍스트만 띄운다. 브로커에 붙지 않는다.
      auto-startup: false

modu:
  # Feign 클라이언트는 기동 때 url 을 요구한다. 테스트는 목으로 바꾸므로 유효하기만 한 가짜 주소를 둔다.
  services:
    chat-service: http://localhost:1
  internal-api:
    token: test-internal-token

# main 의 application.yml 과 같은 probe 설정(이 파일이 main 을 가리므로 여기에도 둔다). HealthProbesTest 가 본다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, mongo
        liveness:
          include: livenessState
