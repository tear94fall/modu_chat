server:
  port: 9090
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(spring.lifecycle.timeout-per-shutdown-phase 안에서).
  shutdown: graceful

spring:
  application:
    name: chat-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  profiles:
    active: dev

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # messenger.yml 이 datasource 비밀번호(spring.datasource.master.password / replica.password)를 준다.
      # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      name: messenger,${spring.application.name}
      fail-fast: true

  # master(읽기/쓰기) + replica(읽기 전용). 스키마 modu-chat 은 mysql-chat 인스턴스에 있다.
  # 주소·계정은 compose 환경 변수가, 비밀번호는 config-service 가 준다. 아래는 그것 없이 띄울 때의 기본값이며,
  # replica 기본값은 master 를 가리킨다(로컬처럼 레플리카가 없는 환경).
  # 프로필별 파일(application-dev.yml 등)은 두지 않는다 — 거기에 password 를 적으면 config-service 가 준 값을 덮어쓴다.
  datasource:
    master:
      url: ${DB_MASTER_URL:jdbc:mysql://localhost:3307/modu-chat}
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    replica:
      url: ${DB_REPLICA_URL:${spring.datasource.master.url}}
      username: ${DB_REPLICA_USERNAME:${spring.datasource.master.username}}
      password: ${DB_REPLICA_PASSWORD:${spring.datasource.master.password}}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: replica-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        read-only: true

  jpa:
    hibernate:
      # master 에서만 돈다. replica 의 EntityManagerFactory 는 항상 none 이다(RoJpaConfig).
      # 스키마는 DBA 가 gh-ost 로 바꾼다(modu_infra/data/mysql/schema). 코드와 어긋나면 기동 실패로 드러나게 validate.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    open-in-view: false

  # bootstrap-servers 는 config-service 가 준다.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chat-save-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  instance:
    instance-id: chat-service

  client:
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness — 쿠버네티스 probe 와 compose healthcheck 가 본다.
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 자동 db indicator 는 ro·rw 를 다 보므로 넣지 않는다 — 레플리카가 죽어도 unready 가 되면 안 된다. master 만 보는 masterDb(MasterDbHealthConfig).
          include: readinessState, masterDb
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
