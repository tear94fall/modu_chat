name: modu-messenger

# 인프라(MySQL, MongoDB, Redis, Kafka, RabbitMQ, MinIO)와 관측성 스택은 ~/workspace/modu_infra 에서,
# 플랫폼(config-service, discovery-service, gateway-service)은 ~/workspace/modu_platform 에서 먼저 띄운다.
# 서비스는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라·플랫폼에 접근한다.
# 다른 compose 프로젝트라 depends_on 을 걸 수 없다. 설정을 못 받으면 서비스가 기동에 실패하고(fail-fast)
# restart: always 가 다시 띄우므로, 플랫폼이 뜨면 자연히 따라 올라온다.
# healthcheck 는 readiness probe(/actuator/health/readiness)를 보고, stop_grace_period 30s 는 server.shutdown=graceful
# (spring.lifecycle.timeout-per-shutdown-phase 20s)이 처리 중인 요청을 끝낼 시간을 준다. amazoncorretto:21 에 curl 이 있다.

services:

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth-service
    ports:
      - 9900:9900
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${AUTH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9900/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  chat-service:
    build:
      context: ./chat-service
      dockerfile: ./Dockerfile
    container_name: chat-service
    ports:
      - 9090:9090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-chat:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-chat-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${CHAT_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  member-service:
    build:
      context: ./member-service
      dockerfile: ./Dockerfile
    container_name: member-service
    ports:
      - 8080:8080
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${MEMBER_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always
    # actuator 는 dev 프로필의 management.server.port(8082)에 뜬다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  profile-service:
    build:
      context: ./profile-service
      dockerfile: ./Dockerfile
    container_name: profile-service
    ports:
      - 8880:8880
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-profile:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-profile-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${PROFILE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  push-service:
    build:
      context: ./push-service
      dockerfile: ./Dockerfile
    container_name: push-service
    ports:
      - 9990:9990
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-push:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-push-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${PUSH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9990/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  storage-service:
    build:
      context: ./storage-service
      dockerfile: ./Dockerfile
    container_name: storage-service
    ports:
      - 9999:9999
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - minio.endpoint=http://minio:9000
      - JAVA_TOOL_OPTIONS=${STORAGE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s
    volumes:
      - /var/modu-chat/storage/data:/data
      - pinpoint-agent:/pinpoint-agent:ro

  ws-service:
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    ports:
      - 8090:8090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${WS_SERVICE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    # 종료 때 WebSocket 세션을 1001 로 닫고(WebSocketSessionCloser) 앱이 재접속한다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  point-service:
    build:
      context: ./point-service
      dockerfile: ./Dockerfile
    container_name: point-service
    ports:
      - 9600:9600
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      # mysql-member 인스턴스의 별도 스키마(modu-point). 스키마는 point-service/sql/schema.sql 로 한 번 만든다.
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-point
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-point
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${POINT_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  schedule-service:
    build:
      context: ./schedule-service
      dockerfile: ./Dockerfile
    container_name: schedule-service
    ports:
      - 8110:8110
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      # mysql-member 인스턴스의 별도 스키마(modu-schedule). 테이블은 DBA 가 master 에 만들고(modu_infra/data/mysql/schema) 복제로 넘어간다. 앱은 validate 만 한다.
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-schedule
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-schedule
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${SCHEDULE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8110/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  chat-store-service:
    build:
      context: ./chat-store-service
      dockerfile: ./Dockerfile
    container_name: chat-store-service
    ports:
      - 8100:8100
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${CHAT_STORE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

networks:
  modu-infra:
    external: true
  pinpoint:
    external: true
    name: pinpoint-docker_pinpoint
  # Redis 클러스터 노드는 modu_infra 의 클러스터 전용 네트워크 IP(10.90.0.x)를 광고한다.
  # Redisson(member-service)은 그 IP 로 붙으므로 auth-service·member-service 는 이 네트워크에도 참여한다.
  redis-cluster:
    external: true
    name: modu-data_redis-cluster

volumes:
  pinpoint-agent:
    external: true
    name: pinpoint-docker_data-volume
