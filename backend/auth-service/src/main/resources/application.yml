server:
  port: 9900
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(spring.lifecycle.timeout-per-shutdown-phase 안에서).
  shutdown: graceful

spring:
  application:
    name: auth-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      name: messenger,${spring.application.name}
      fail-fast: true

  rabbitmq:
    port: 5672

logging:
  level:
    org.hibernate.SQL: debug

eureka:
  instance:
    instance-id: auth-service

  client:
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness — 쿠버네티스 probe 와 compose healthcheck 가 본다.
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # DB 가 없다. 토큰·SSO 코드 저장소인 Redis 가 필수 의존(자동 redis indicator).
          include: readinessState, redis
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
