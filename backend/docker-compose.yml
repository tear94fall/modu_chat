name: modu-messenger

# 인프라(MySQL, MongoDB, Redis, Kafka, RabbitMQ, MinIO)와 관측성 스택은 ~/workspace/modu_infra 에서 먼저 띄운다.
# 서비스는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라에 접근한다.

services:
  config-service:
    build:
      context: ./config-service
      dockerfile: ./Dockerfile
    container_name: config-service
    ports:
      - 8888:8888
    environment:
      - ENCRYPT_KEY=${ENCRYPT_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - JAVA_TOOL_OPTIONS=${CONFIG_AGENT_OPTS:-}
    volumes:
      - ./config-repo:/config-repo:ro
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: always

  discovery-service:
    container_name: discovery-service
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - 8761:8761
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${DISCOVERY_AGENT_OPTS:-}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    depends_on:
      config-service:
        condition: service_healthy
    networks:
      - modu-infra
      - pinpoint
    restart: always

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: ./Dockerfile
    container_name: gateway-service
    ports:
      - 8000:8000
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${GATEWAY_AGENT_OPTS:-}
      - ADMIN_ALLOWED_ORIGIN=${ADMIN_ALLOWED_ORIGIN:-http://localhost:5173}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth-service
    ports:
      - 9900:9900
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${AUTH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always

  chat-service:
    build:
      context: ./chat-service
      dockerfile: ./Dockerfile
    container_name: chat-service
    ports:
      - 9090:9090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-chat:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${CHAT_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

  member-service:
    build:
      context: ./member-service
      dockerfile: ./Dockerfile
    container_name: member-service
    ports:
      - 8080:8080
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-member:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${MEMBER_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always

  profile-service:
    build:
      context: ./profile-service
      dockerfile: ./Dockerfile
    container_name: profile-service
    ports:
      - 8880:8880
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-profile:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${PROFILE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

  push-service:
    build:
      context: ./push-service
      dockerfile: ./Dockerfile
    container_name: push-service
    ports:
      - 9990:9990
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-push:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${PUSH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

  storage-service:
    build:
      context: ./storage-service
      dockerfile: ./Dockerfile
    container_name: storage-service
    ports:
      - 9999:9999
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - minio.endpoint=http://minio:9000
      - JAVA_TOOL_OPTIONS=${STORAGE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - modu-infra
      - pinpoint
    restart: always
    volumes:
      - /var/modu-chat/storage/data:/data
      - pinpoint-agent:/pinpoint-agent:ro

  ws-service:
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    ports:
      - 8090:8090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${WS_SERVICE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

  chat-store-service:
    build:
      context: ./chat-store-service
      dockerfile: ./Dockerfile
    container_name: chat-store-service
    ports:
      - 8100:8100
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${CHAT_STORE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always

networks:
  modu-infra:
    external: true
  pinpoint:
    external: true
    name: pinpoint-docker_pinpoint
  # Redis 클러스터 노드는 modu_infra 의 클러스터 전용 네트워크 IP(10.90.0.x)를 광고한다.
  # Redisson(member-service)은 그 IP 로 붙으므로 auth-service·member-service 는 이 네트워크에도 참여한다.
  redis-cluster:
    external: true
    name: modu-data_redis-cluster

volumes:
  pinpoint-agent:
    external: true
    name: pinpoint-docker_data-volume
