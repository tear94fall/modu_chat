server:
  port: 9900

spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6399

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

