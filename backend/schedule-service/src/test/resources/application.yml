server:
  port: 8110

spring:
  config:
    activate:
      on-profile: test

  application:
    name: schedule-service

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

  sleuth:
    sampler:
      probability: 1.0
  zipkin:
    base-url: http://localhost:9411

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

logging:
  level:
    org.hibernate.SQL: debug

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  instance:
    instance-id: schedule-service

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
---
# 위 문서는 spring.config.activate.on-profile: test 로 게이트되어 있고, 테스트 실행 시에는
# 활성 프로파일이 없어(default 로 폴백) 그 문서가 적용되지 않는다. 그래서 이 프로퍼티는
# 프로파일 조건 없는 별도 문서에 둔다.
# InternalApiFilter / InternalApiFeignConfig 가 요구한다. 운영은 config-repo 가 내려준다.
modu:
  internal-api:
    token: test-internal-token