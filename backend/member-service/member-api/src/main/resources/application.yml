server:
  port: 8080

spring:
  application:
    name: member-service

  profiles:
    active: dev
    include: oauth

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      # messenger.yml 이 datasource 비밀번호(spring.datasource.master.password / replica.password)를 준다.
      name: messenger,${spring.application.name}
      fail-fast: true

  # master(읽기/쓰기) + replica(읽기 전용). 스키마 modu-chat 은 mysql-member 인스턴스에 있다.
  # 주소·계정은 compose 환경 변수가, 비밀번호는 config-service 가 준다. 아래는 그것 없이 띄울 때의 기본값이며,
  # replica 기본값은 master 를 가리킨다(로컬처럼 레플리카가 없는 환경). 프로필 파일(application-*.yml)이 덮어쓸 수 있다.
  datasource:
    master:
      url: ${DB_MASTER_URL:jdbc:mysql://localhost:3306/modu-chat?serverTimezone=Asia/Seoul}
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    replica:
      url: ${DB_REPLICA_URL:${spring.datasource.master.url}}
      username: ${DB_REPLICA_USERNAME:${spring.datasource.master.username}}
      password: ${DB_REPLICA_PASSWORD:${spring.datasource.master.password}}
      driver-class-name: ${spring.datasource.master.driver-class-name}
      hikari:
        pool-name: replica-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        read-only: true

# 탈퇴 때 커머스 고객 정리를 부를 주소(CommerceClient). 커머스는 Eureka 밖이라 주소를 직접 쓴다.
modu:
  commerce:
    url: http://commerce-service:8200
  # 서비스 이용 기록(member_service_usage): auth-service 등록 클라이언트 ID → 서비스.
  # 여기 없는 클라이언트(직원 콘솔 modu-admin 등)는 기록하지 않는다.
  member:
    usage-clients:
      "[modu-chat]": CHAT
      "[modu-commerce]": COMMERCE

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
