# 테스트 설정. 같은 이름(application.yml)이라 main 의 것을 가린다 — 필요한 값은 여기에 다 있다.
server:
  port: 8880

spring:
  application:
    name: profile-service

  profiles:
    active: test

  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면
  # Spring Cloud Commons 의 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false

  # master 와 replica 가 같은 H2 를 본다(복제 지연 없음). 늦은 레플리카는 ReplicaLagTest 가 replica.url 만 바꿔 만든다.
  # 컬럼 이름 value 가 H2 예약어라 테이블이 안 만들어진다(MySQL 은 허용). 예약어에서 뺀다.
  datasource:
    master:
      url: jdbc:h2:mem:profile_api;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-master-pool
        maximum-pool-size: 5

    replica:
      url: jdbc:h2:mem:profile_api;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-replica-pool
        maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

  kafka:
    producer:
      bootstrap-servers: localhost:29092

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 3000
        permittedNumberOfCallsInHalfOpenState: 4
        maxWaitDurationInHalfOpenState: 3000
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 1000
    instances:
      memberProfileCircuitBreaker:
        baseConfig: default

logging:
  level:
    org.hibernate.SQL: debug

# InternalApiFilter / InternalApiFeignConfig 가 요구한다. 운영은 config-repo 가 내려준다.
modu:
  # Feign 클라이언트는 기동 때 url 을 요구한다. 테스트는 목으로 바꾸므로 유효하기만 한 가짜 주소를 둔다.
  services:
    member-service: http://localhost:1
    storage-service: http://localhost:1
  internal-api:
    token: test-internal-token

springdoc:
  paths-to-exclude: /actuator/**, /error

# main 의 application.yml 과 같은 probe 설정(이 파일이 main 을 가리므로 여기에도 둔다). HealthProbesTest 가 본다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, masterDb
        liveness:
          include: livenessState
