server:
  port: 9999

spring:
  application:
    name: storage-service

  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면
  # Spring Cloud Commons 의 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: /data

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


  kafka:
    producer:
      bootstrap-servers: localhost:9092
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: localhost:9092
      group-id: test-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

minio:
  endpoint: http://localhost:9000
  # 이 테스트는 @PostConstruct 에서 실제 MinIO 에 접속하므로
  # 로컬 docker 스택의 값과 일치해야 한다. 운영 자격증명이 아니라 개발용 고정값이다.
  accessKey: minio
  secretKey: miniopass
  bucketImageName: file-storage

eureka:
  instance:
    instance-id: storage-service

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org:
      apache:
        kafka: DEBUG

# InternalApiFilter / InternalApiFeignConfig 가 요구한다. 운영은 config-repo 가 내려준다.
modu:
  internal-api:
    token: test-internal-token