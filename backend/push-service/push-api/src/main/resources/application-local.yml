server:
  port: 9990

spring:
  application:
    name: push-service

  config:
    activate:
      on-profile: local

  # master(읽기/쓰기) + replica(읽기 전용). 로컬은 H2 서버 하나를 둘 다 본다.
  # 비밀번호는 config-service(messenger.yml)의 spring.datasource.master.password / replica.password 가 준다.
  # replica 기본값은 master 를 가리킨다(레플리카가 없는 환경).
  datasource:
    master:
      url: ${DB_MASTER_URL:jdbc:h2:tcp://localhost/~/modu-chat}
      username: ${DB_MASTER_USERNAME:sa}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    replica:
      url: ${DB_REPLICA_URL:${spring.datasource.master.url}}
      username: ${DB_REPLICA_USERNAME:${spring.datasource.master.username}}
      password: ${DB_REPLICA_PASSWORD:${spring.datasource.master.password}}
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: replica-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        read-only: true

  jpa:
    hibernate:
      # master 에서만 돈다. replica 의 EntityManagerFactory 는 항상 none 이다(RoJpaConfig).
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

project:
  properties:
    firebase-sdk-path: "firebase/modu_chat_firebase_service_key.json"
    firebase-multicast-message-size: 500

eureka:
  instance:
    instance-id: push-service

  client:
    register-with-eureka: true
    fetch-registry: true
