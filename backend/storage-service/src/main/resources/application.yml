server:
  port: 9999
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(spring.lifecycle.timeout-per-shutdown-phase 안에서).
  shutdown: graceful

spring:
  application:
    name: storage-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      name: messenger,${spring.application.name}
      fail-fast: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: /data

  rabbitmq:
    port: 5672

  kafka:
    consumer:
      group-id: storage-service-group

# S3 호환 오브젝트 스토리지(AWS SDK v2). dev 는 Ceph RGW — path-style 주소, region 은 아무 값이나 받는다.
# accessKey·secretKey 는 config-repo(messenger/storage-service.yml)가 {cipher} 로 내려준다.
s3:
  endpoint: http://localhost:9000
  region: us-east-1
  bucket: file-storage

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness — 쿠버네티스 probe 와 compose healthcheck 가 본다.
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # S3 는 자동 indicator 가 없다 — S3HealthIndicator(버킷 존재 확인).
          include: readinessState, s3
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error

# API 요청·응답 전체 로그(logging/ApiLoggingFilter, 이벤트 api.access): /api- 아래 요청의 헤더·쿼리·요청 본문·응답 본문을 한 줄 JSON 으로.
# 본문은 max-body-bytes 까지 남기고 넘으면 자른다(커머스 기본 4096 보다 크게 — 방 목록처럼 큰 응답도 전부 보려고). 끄려면 enabled: false.
modu:
  logging:
    api:
      enabled: true
      max-body-bytes: 65536
      # 파일 본문을 흘려보내는 끝점은 응답을 메모리에 담지 않도록 뺀다(http.access 한 줄은 그대로 남는다).
      exclude-paths: [/api-public/download, /api-public/view/, /api-admin/view/]
