server:
  port: 8080

spring:
  application:
    name: member-service

  profiles:
    active: dev
    include: oauth

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      name: messenger,${spring.application.name}
      fail-fast: true

# 탈퇴 때 커머스 고객 정리를 부를 주소(CommerceClient). 커머스는 Eureka 밖이라 주소를 직접 쓴다.
modu:
  commerce:
    url: http://commerce-service:8200
  # 서비스 이용 기록(member_service_usage): auth-service 등록 클라이언트 ID → 서비스.
  # 여기 없는 클라이언트(직원 콘솔 modu-admin 등)는 기록하지 않는다.
  member:
    usage-clients:
      "[modu-chat]": CHAT
      "[modu-commerce]": COMMERCE

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
