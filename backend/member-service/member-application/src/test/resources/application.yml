# member-application 모듈 테스트 설정(웹·Spring Cloud 없이 JPA + 분산락).
spring:
  application:
    name: member-service

  profiles:
    active: test

  # master 와 replica 가 같은 H2 를 본다(복제 지연 없음).
  datasource:
    master:
      url: jdbc:h2:mem:member_application;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-master-pool
        maximum-pool-size: 5

    replica:
      url: jdbc:h2:mem:member_application;MODE=MYSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: test-replica-pool
        maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 1000
    open-in-view: false

  # 분산락(Redisson)이 붙는 임베디드 Redis(RedisEmbeddedConfig)
  data:
    redis:
      host: localhost
      port: 6379

# 서비스 이용 기록(member_service_usage): auth-service 등록 클라이언트 ID → 서비스.
modu:
  member:
    usage-clients:
      "[modu-chat]": CHAT
      "[modu-commerce]": COMMERCE
