server:
  port: 9600

spring:
  application:
    name: point-service

  profiles:
    active: dev

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # modu_platform 의 config-service. 공통(application.yml) + 메신저 공통(messenger/messenger.yml) + 이 서비스 파일을 받는다.
      # messenger.yml 이 datasource 비밀번호(spring.datasource.master.password / replica.password)를 준다.
      # 설정 서버를 못 만나면 기동에 실패한다(compose 의 restart 가 다시 띄운다).
      name: messenger,${spring.application.name}
      fail-fast: true

  # master(읽기/쓰기) + replica(읽기 전용). 스키마 modu-point 는 mysql-member 인스턴스에 있다(sql/schema.sql).
  # 주소·계정은 compose 환경 변수가, 비밀번호는 config-service 가 준다. 아래는 그것 없이 띄울 때의 기본값이며,
  # replica 기본값은 master 를 가리킨다(로컬처럼 레플리카가 없는 환경).
  datasource:
    master:
      url: ${DB_MASTER_URL:jdbc:mysql://localhost:3306/modu-point}
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    replica:
      url: ${DB_REPLICA_URL:${spring.datasource.master.url}}
      username: ${DB_REPLICA_USERNAME:${spring.datasource.master.username}}
      password: ${DB_REPLICA_PASSWORD:${spring.datasource.master.password}}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: replica-pool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        read-only: true

  jpa:
    hibernate:
      # master 에서만 돈다. replica 의 EntityManagerFactory 는 항상 none 이다(RoJpaConfig).
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
