server:
  port: 9600

spring:
  application:
    name: point-service

  profiles:
    active: test

  # 테스트는 config-server 를 쓰지 않는다. enabled: false 면
  # Spring Cloud Commons 의 spring.config.import 필수 검사도 통과한다.
  cloud:
    config:
      enabled: false

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;MODE=MYSQL
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# InternalApiFilter 가 요구한다. 운영은 config-repo 가 내려준다.
modu:
  internal-api:
    token: test-internal-token
