version: '3.8'

services:
  mysql-member:
    image: mysql
    container_name: mysql-member
    ports:
      - 3306:3306
    volumes:
      - mysql-member:/var/lib/mysql
    environment:
      MYSQL_DATABASE: modu-chat
      MYSQL_USER: user 
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - modu-chat-network
      - observability
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 2s
      retries: 100
    restart: always
  
  mysql-chat:
    image: mysql
    container_name: mysql-chat
    ports:
      - 3307:3306
    volumes:
      - mysql-chat:/var/lib/mysql
    environment:
      MYSQL_DATABASE: modu-chat
      MYSQL_USER: user 
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - modu-chat-network
      - observability
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 2s
      retries: 100
    restart: always
  
  mysql-push:
    image: mysql
    container_name: mysql-push
    ports:
      - 3308:3306
    volumes:
      - mysql-push:/var/lib/mysql
    environment:
      MYSQL_DATABASE: modu-chat
      MYSQL_USER: user 
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - modu-chat-network
      - observability
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 2s
      retries: 100
    restart: always
  
  mysql-profile:
    image: mysql
    container_name: mysql-profile
    ports:
      - 3309:3306
    volumes:
      - mysql-profile:/var/lib/mysql
    environment:
      MYSQL_DATABASE: modu-chat
      MYSQL_USER: user 
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - modu-chat-network
      - observability
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 2s
      retries: 100
    restart: always

  mongo-01:
    container_name: mongo-01
    image: mongo
    volumes:
      - mongo-01:/data/db
      - ./infra/mongodb/rs-init.sh:/scripts/rs-init.sh
      - ./infra/mongodb/mongodb.key:/mongodb.key
    ports:
      - 27017:27017
    links:
      - mongo-02
      - mongo-03
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["--keyFile", "./mongodb.key",  "--bind_ip_all", "--replSet", "mongo-rs" ]
    networks:
      - modu-chat-network
      - observability

  mongo-02:
    container_name: mongo-02
    image: mongo
    volumes:
      - mongo-02:/data/db
      - ./infra/mongodb/mongodb.key:/mongodb.key
    ports:
      - 27018:27017
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["--keyFile", "./mongodb.key", "--bind_ip_all", "--replSet", "mongo-rs" ]
    networks:
      - modu-chat-network
      - observability

  mongo-03:
    container_name: mongo-03
    image: mongo
    volumes:
      - mongo-03:/data/db
      - ./infra/mongodb/mongodb.key:/mongodb.key
    ports:
      - 27019:27017
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["--keyFile", "./mongodb.key",  "--bind_ip_all", "--replSet", "mongo-rs" ]
    networks:
      - modu-chat-network
      - observability

  redis:
    image: redis:alpine
    command: redis-server --port 6379
    container_name: redis
    hostname: redis
    labels:
      - "name=redis"
      - "mode=standalone"
    ports:
      - 6379:6379
    networks:
      - modu-chat-network
      - observability
  
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
      - 25672:25672
    networks:
      - modu-chat-network
      - observability

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - modu-chat-network

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-broker-1
    container_name: kafka
    ports:
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - modu-chat-network
      - observability

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9009:8080
    depends_on:
      - zookeeper
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-ui
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - modu-chat-network

  debezium:
    image: debezium/connect:latest
    container_name: debezium
    ports:
      - 8083:8083
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-config
      OFFSET_STORAGE_TOPIC: debezium-offset
      STATUS_STORAGE_TOPIC: debezium-status
      BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - modu-chat-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: always
    shm_size: '1gb'
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - modu-chat-network
    volumes:
      - /var/modu-chat/minio/data:/data

  config-service:
    build:
      context: ./config-service
      dockerfile: ./Dockerfile
    container_name: config-service
    ports:
      - 8888:8888
    environment:
      - ENCRYPT_KEY=${ENCRYPT_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - JAVA_TOOL_OPTIONS=${CONFIG_AGENT_OPTS:-}
    volumes:
      - ./config-repo:/config-repo:ro
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: always

  discovery-service:
    container_name: discovery-service
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - 8761:8761
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${DISCOVERY_AGENT_OPTS:-}
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    depends_on:
      config-service:
        condition: service_healthy
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: ./Dockerfile
    container_name: gateway-service
    ports:
      - 8000:8000
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${GATEWAY_AGENT_OPTS:-}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth-service
    ports:
      - 9900:9900
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${AUTH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  chat-service:
    build:
      context: ./chat-service
      dockerfile: ./Dockerfile
    container_name: chat-service
    ports:
      - 9090:9090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-chat:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${CHAT_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      mysql-chat:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  member-service:
    build:
      context: ./member-service
      dockerfile: ./Dockerfile
    container_name: member-service
    ports:
      - 8080:8080
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-member:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${MEMBER_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      mysql-member:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  profile-service:
    build:
      context: ./profile-service
      dockerfile: ./Dockerfile
    container_name: profile-service
    ports:
      - 8880:8880
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-profile:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${PROFILE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      mysql-profile:
        condition: service_healthy
      discovery-service:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  push-service:
    build:
      context: ./push-service
      dockerfile: ./Dockerfile
    container_name: push-service
    ports:
      - 9990:9990
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql-push:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${PUSH_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      config-service:
        condition: service_healthy
      mysql-push:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  storage-service:
    build:
      context: ./storage-service
      dockerfile: ./Dockerfile
    container_name: storage-service
    ports:
      - 9999:9999
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - minio.endpoint=http://minio:9000
      - JAVA_TOOL_OPTIONS=${STORAGE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      minio:
        condition: service_started
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always
    volumes:
      - /var/modu-chat/storage/data:/data
      - pinpoint-agent:/pinpoint-agent:ro

  ws-service:
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    ports:
      - 8090:8090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${WS_SERVICE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      mysql-chat:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

  chat-store-service:
    build:
      context: ./chat-store-service
      dockerfile: ./Dockerfile
    container_name: chat-store-service
    ports:
      - 8100:8100
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${CHAT_STORE_AGENT_OPTS:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      mysql-chat:
        condition: service_healthy
      discovery-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-chat-network
      - observability
      - pinpoint
    restart: always

networks:
  modu-chat-network:
    driver: bridge
  observability:
    external: true
  pinpoint:
    external: true
    name: pinpoint-docker_pinpoint

volumes:
  mysql-data:
  mysql-member:
  mysql-chat:
  mysql-push:
  mysql-profile:
  mongo-01:
  mongo-02:
  mongo-03:
  pinpoint-agent:
    external: true
    name: pinpoint-docker_data-volume