server:
  port: 9990

spring:
  application:
    name: push-service

  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:tcp://localhost/~/modu-chat
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

project:
  properties:
    firebase-sdk-path: "firebase/modu_chat_firebase_service_key.json"
    firebase-multicast-message-size: 500

eureka:
  instance:
    instance-id: push-service

  client:
    register-with-eureka: true
    fetch-registry: true
