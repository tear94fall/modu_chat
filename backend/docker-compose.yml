name: modu-messenger

# 이미지: CI(GitHub Actions, .github/workflows/images.yml)가 같은 Dockerfile 로 빌드해 GHCR 에 올린다.
#   docker compose pull && docker compose up -d   → CI 이미지(IMAGE_TAG, 기본 develop)
#   docker compose up -d --build                  → 로컬 빌드(같은 Dockerfile, 멀티스테이지라 jar 를 미리 만들 필요 없다)

# 인프라(MySQL, MongoDB, Redis, Kafka, RabbitMQ, MinIO)와 관측성 스택은 ~/workspace/modu_infra 에서,
# 플랫폼(config-service, gateway-service)은 ~/workspace/modu_platform 에서 먼저 띄운다.
# 서비스는 external 네트워크 modu-infra 에서 컨테이너 이름으로 인프라·플랫폼에 접근한다.
# 다른 compose 프로젝트라 depends_on 을 걸 수 없다. 설정을 못 받으면 서비스가 기동에 실패하고(fail-fast)
# restart: always 가 다시 띄우므로, 플랫폼이 뜨면 자연히 따라 올라온다.
# healthcheck 는 readiness probe(/actuator/health/readiness)를 보고, stop_grace_period 30s 는 server.shutdown=graceful
# (spring.lifecycle.timeout-per-shutdown-phase 20s)이 처리 중인 요청을 끝낼 시간을 준다. amazoncorretto:21 에 curl 이 있다.
# 내부 API 토큰(modu.internal-api.token)을 비롯한 모든 비밀값(DB 비밀번호, 구글 OAuth 클라이언트, Firebase 키)은
# 이 파일이나 .env 가 아니라 modu_platform 의 config-repo({cipher})에서 config-service 가 내려준다. .env 에는 Pinpoint 에이전트 옵션만 둔다.
# JAVA_TOOL_OPTIONS 의 -Dprofiler.logback.logging.transactioninfo=true: Pinpoint 에이전트가 트랜잭션 id(PtxId·PspanId)를 MDC 에 넣어
# JSON 로그 줄과 Pinpoint 호출 트리를 잇는다. 에이전트 옵션(*_AGENT_OPTS)이 비어 있으면 그냥 무시된다.

# 모든 컨테이너 로그 줄에 compose 서비스·프로젝트 이름을 붙인다(json-file attrs). OTel Collector 가 container 필드와 앱/인프라 인덱스 구분에 쓴다(modu_infra monitoring).
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service,com.docker.compose.project
    max-size: "50m"
    max-file: "3"

# 컨테이너 메모리 제한. JVM 은 -XX:MaxRAMPercentage=75 로 이 안에서 힙을 잡는다(1g → 힙 최대 768MiB).
# k8s 의 resources.requests(mem_reservation)/limits(mem_limit) 와 같은 값으로 매니페스트에 옮긴다.
x-jvm-resources: &jvm-resources
  mem_limit: 1g
  mem_reservation: 512m
x-small-resources: &small-resources
  mem_limit: 64m
  mem_reservation: 16m

services:

  auth-service:
    image: ghcr.io/tear94fall/modu-chat/auth-service:${IMAGE_TAG:-develop}
    build:
      context: ./auth-service
      dockerfile: ./Dockerfile
    container_name: auth-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 9900:9900
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${AUTH_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9900/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  chat-service:
    image: ghcr.io/tear94fall/modu-chat/chat-service:${IMAGE_TAG:-develop}
    build:
      context: ./chat-service
      dockerfile: ./Dockerfile
    container_name: chat-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 9090:9090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-chat:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-chat-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${CHAT_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  member-service:
    image: ghcr.io/tear94fall/modu-chat/member-service:${IMAGE_TAG:-develop}
    build:
      context: ./member-service
      dockerfile: ./Dockerfile
    container_name: member-service
    logging: *logging
    <<: *jvm-resources
    # 회원·친구·스태프·사용 기록까지 들고 있어 non-heap 이 가장 크다(측정 RSS 800MiB).
    mem_limit: 1280m
    ports:
      - 8080:8080
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${MEMBER_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
      - redis-cluster
    restart: always
    # actuator 는 dev 프로필의 management.server.port(8082)에 뜬다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  profile-service:
    image: ghcr.io/tear94fall/modu-chat/profile-service:${IMAGE_TAG:-develop}
    build:
      context: ./profile-service
      dockerfile: ./Dockerfile
    container_name: profile-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8880:8880
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-profile:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-profile-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${PROFILE_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  push-service:
    image: ghcr.io/tear94fall/modu-chat/push-service:${IMAGE_TAG:-develop}
    build:
      context: ./push-service
      dockerfile: ./Dockerfile
    container_name: push-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 9990:9990
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.master.url=jdbc:mysql://mysql-push:3306/modu-chat
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-push-replica:3306/modu-chat
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${PUSH_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9990/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  storage-service:
    image: ghcr.io/tear94fall/modu-chat/storage-service:${IMAGE_TAG:-develop}
    build:
      context: ./storage-service
      dockerfile: ./Dockerfile
    container_name: storage-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 9999:9999
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - minio.endpoint=http://minio:9000
      - JAVA_TOOL_OPTIONS=${STORAGE_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s
    volumes:
      - /var/modu-chat/storage/data:/data
      - pinpoint-agent:/pinpoint-agent:ro

  ws-service:
    image: ghcr.io/tear94fall/modu-chat/ws-service:${IMAGE_TAG:-develop}
    build:
      context: ./ws-service
      dockerfile: ./Dockerfile
    container_name: ws-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8090:8090
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - spring.datasource.url=jdbc:mysql://mysql:3306/modu-chat
      - spring.datasource.username=root
      - JAVA_TOOL_OPTIONS=${WS_SERVICE_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    # 종료 때 WebSocket 세션을 1001 로 닫고(WebSocketSessionCloser) 앱이 재접속한다.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  point-service:
    image: ghcr.io/tear94fall/modu-chat/point-service:${IMAGE_TAG:-develop}
    build:
      context: ./point-service
      dockerfile: ./Dockerfile
    container_name: point-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 9600:9600
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      # mysql-member 인스턴스의 별도 스키마(modu-point). 스키마는 point-service/sql/schema.sql 로 한 번 만든다.
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-point
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-point
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${POINT_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  schedule-service:
    image: ghcr.io/tear94fall/modu-chat/schedule-service:${IMAGE_TAG:-develop}
    build:
      context: ./schedule-service
      dockerfile: ./Dockerfile
    container_name: schedule-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8110:8110
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      # mysql-member 인스턴스의 별도 스키마(modu-schedule). 테이블은 DBA 가 master 에 만들고(modu_infra/data/mysql/schema) 복제로 넘어간다. 앱은 validate 만 한다.
      - spring.datasource.master.url=jdbc:mysql://mysql-member:3306/modu-schedule
      - spring.datasource.master.username=root
      # 읽기 전용 복제본. 비밀번호(master/replica)는 config-service(messenger.yml)가 준다.
      - spring.datasource.replica.url=jdbc:mysql://mysql-member-replica:3306/modu-schedule
      - spring.datasource.replica.username=modu_ro
      - JAVA_TOOL_OPTIONS=${SCHEDULE_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8110/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

  chat-store-service:
    image: ghcr.io/tear94fall/modu-chat/chat-store-service:${IMAGE_TAG:-develop}
    build:
      context: ./chat-store-service
      dockerfile: ./Dockerfile
    container_name: chat-store-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8100:8100
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      - JAVA_TOOL_OPTIONS=${CHAT_STORE_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s

networks:
  modu-infra:
    external: true
  pinpoint:
    external: true
    name: pinpoint-docker_pinpoint
  # Redis 클러스터 노드는 modu_infra 의 클러스터 전용 네트워크 IP(10.90.0.x)를 광고한다.
  # Redisson(member-service)은 그 IP 로 붙으므로 auth-service·member-service 는 이 네트워크에도 참여한다.
  redis-cluster:
    external: true
    name: modu-data_redis-cluster

volumes:
  pinpoint-agent:
    external: true
    name: pinpoint-docker_data-volume
